name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-user-api
  cancel-in-progress: false

env:
  IMAGE: johnpauloramil187/chatterloop_developer_service
  STACK_FILE: chatterloop-developer-service.yml
  STACK_NAME: chatterloop-developer-service

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to swarm
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd ./deployments
            IMAGE_TAG=${{ github.ref_name }} docker stack deploy \
              --with-registry-auth \
              --detach=false \
              -c ${{ env.STACK_FILE }} ${{ env.STACK_NAME }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
